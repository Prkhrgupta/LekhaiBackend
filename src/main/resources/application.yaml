spring:
  application:
    name: lekhai
  server:
    port: 8080

  # Database Configuration
  datasource:
    name: lekhai
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lekhai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
