buildscript {
    dependencies {
        classpath("org.postgresql:postgresql:42.2.17")
        classpath("org.flywaydb:flyway-database-postgresql:11.6.0")
    }
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.1'
	id 'io.spring.dependency-management' version '1.1.7'
    id 'org.flywaydb.flyway' version '10.21.0'
	id("com.google.cloud.tools.jib") version "3.4.7"
}

group = 'in.lekhai'
version = '0.0.1-SNAPSHOT'
description = 'Lekhai Backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
    mavenLocal()
	mavenCentral()
}

dependencies {
    // Lekhai Api Spec
//    implementation "in.lekhai:lekhai-api-spec:1.0.4"
    implementation 'in.lekhai:lekhaiapispec:1.0.12'

	implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation("org.springframework.batch:spring-batch-core:5.1.3")

	// database
    implementation 'org.postgresql:postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'

	// security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

    // opencsv
    implementation 'com.opencsv:opencsv:5.9'

    // apache POI
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

	// JWT
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // WebFlux
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // caching - caffeine
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // monitoring
    implementation("net.logstash.logback:logstash-logback-encoder:8.1") // json log structure for loki
    // traceId && spanId
    implementation("org.springframework.boot:spring-boot-starter-actuator")
    implementation("io.micrometer:micrometer-tracing-bridge-brave")

	// test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

jar {
	enabled = false
}

// ./gradlew flywayMigrate -Duser.timezone=UTC
flyway {
    configFiles = ['src/main/resources/flyway.conf']
}

jib {
	from {
		image = 'eclipse-temurin:21-jre-jammy'
	}
	to {
		image = 'docker.io/prkhrgupta/lekhai-backend'
		tags = ['latest']
	}
	container {
		mainClass = 'in.lekhai.LekhaiApplication'
		jvmFlags = ['-XX:+UseContainerSupport','-XX:MaxRAMPercentage=75.0']
	}
}