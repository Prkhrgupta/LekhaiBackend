name: CI/CD - Build & Deploy

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

env:
  IMAGE_NAME: docker.io/prkhrgupta/lekhai_backend

jobs:
  build_and_push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    environment: staging
    # IMPORTANT: You must declare job-level outputs so the deploy job can read them
    outputs:
      tag: ${{ steps.image_info.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'

      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build & Push (Jib)
        env:
          REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
        run: |
          TAG=${GITHUB_SHA::7}
          echo "Building and pushing image ${IMAGE_NAME}:${TAG} and :latest"
          ./gradlew --no-daemon \
          -Pjib.to.tags="${TAG},latest" \
          -Djib.to.auth.username="${{ secrets.DOCKER_USERNAME }}" \
          -Djib.to.auth.password="${{ secrets.DOCKER_TOKEN }}" \
          jib

      - name: Set image tag output
        id: image_info
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Server
    needs: build_and_push
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Deploy over SSH via Cloudflare Tunnel
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ vars.SERVER_HOST }}
          USER: ${{ vars.SERVER_USER }}
          IMAGE_TAG: ${{ needs.build_and_push.outputs.tag }}
        run: |
          # 1. Setup SSH Key
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 2. Execute Deployment Script via cloudflared proxy
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ProxyCommand="cloudflared access ssh --hostname %h" \
              $USER@$HOST bash << EOF
          
            set -e
            DEPLOY_DIR="/home/sitswift/lekhai" 
          
            echo "Deploying to \$DEPLOY_DIR using tag ${IMAGE_TAG}"
            cd "\$DEPLOY_DIR"

            export IMAGE_TAG="${IMAGE_TAG}"

            # Pull the exact image and bring up containers
            docker compose pull
            docker compose up -d --no-build

            # Wait for health
            echo "Waiting for service to become healthy..."
            for i in {1..20}; do
              # Dollar signs escaped to run remotely!
              STATUS=\$(docker inspect --format='{{json .State.Health.Status}}' \$(docker compose ps -q app) || echo null)
              echo "Health: \$STATUS"
              if [[ "\$STATUS" == "\"healthy\"" ]]; then
                echo "Service healthy"
                exit 0
              fi
              sleep 3
            done
          
            echo "Health check failed or timed out. Check logs."
            docker compose logs --tail 200
            exit 1
          
          EOF