name: CI/CD - Build & Deploy

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

env:
  IMAGE_NAME: docker.io/prkhrgupta/lekhai_backend

jobs:
  build_and_push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'

      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build & Push (Jib)
        env:
          REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
        run: |
          TAG=${GITHUB_SHA::7}
          echo "Building and pushing image ${IMAGE_NAME}:${TAG} and :latest"
          ./gradlew --no-daemon \
          -Pjib.to.tags="${TAG},latest" \
          -Djib.to.auth.username="${{ secrets.DOCKER_USERNAME }}" \
          -Djib.to.auth.password="${{ secrets.DOCKER_TOKEN }}" \
          jib
      - name: Set image tag output
        id: image_info
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Server
    needs: build_and_push
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy over SSH (pull & up)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            # Update this path to where your docker-compose.yml lives on the server
            DEPLOY_DIR="/home/sitswit/deploy" 
            TAG=${{ needs.build_and_push.outputs.tag }}
            
            echo "Deploying to $DEPLOY_DIR using tag $TAG"
            cd "$DEPLOY_DIR"

            export IMAGE_TAG=$TAG

            # Pull the exact image and bring up containers
            docker compose pull
            docker compose up -d --no-build

            # Wait for health
            echo "Waiting for service to become healthy..."
            for i in {1..20}; do
              STATUS=$(docker inspect --format='{{json .State.Health.Status}}' $(docker compose ps -q app) || echo null)
              echo "Health: $STATUS"
              if [[ "$STATUS" == "\"healthy\"" ]]; then
                echo "Service healthy"
                exit 0
              fi
              sleep 3
            done
            
            echo "Health check failed or timed out. Check logs."
            docker compose logs --tail 200